      content="Файлы и папки, слепая печать и горячие клавиши — понятный путь с нуля. Русский и таджикский."

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "KeyMaster",
        "url": "https://www.keymaster.pp.ua/",
        "description": "Бесплатный тренажёр горячих клавиш и базовых компьютерных навыков на русском и таджикском.",
        "applicationCategory": "EducationalApplication",
        "inLanguage": ["ru", "tg"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('km-theme')
          var theme = 'light'
          if (raw) {
            theme = JSON.parse(raw).state.theme || 'light'
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark'
          }
          if (theme === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
