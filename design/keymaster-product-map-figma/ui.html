      function dataUrlToB64(url) {
        const i = url.indexOf(',');
        return i >= 0 ? url.slice(i + 1) : url;
      }
      function imgToB64(img) {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        return dataUrlToB64(canvas.toDataURL('image/jpeg', 0.82));
      }
      async function waitDecoded(img) {
        if (img.complete && img.naturalWidth) return;
        await img.decode();
      }
      let waiting = null;
      window.onmessage = (e) => {
        const msg = e.data.pluginMessage;
        if (!msg) return;
        if (msg.type === 'ack' && waiting) waiting();
        if (msg.type === 'status') document.getElementById('status').textContent = msg.text;
        if (msg.type === 'ready') startImages();
      };
      function ack() {
        return new Promise((resolve) => {
          waiting = () => { waiting = null; resolve(); };
        });
      }
      async function startImages() {
        const status = document.getElementById('status');
        const bar = document.getElementById('bar');
        bar.max = SHOTS.length;
        for (let i = 0; i < SHOTS.length; i++) {
          const item = SHOTS[i];
          status.textContent = 'Placing ' + (i + 1) + '/' + SHOTS.length + ' — ' + item.name;
          bar.value = i;
          try {
            const img = document.getElementById('shot-' + i);
            await waitDecoded(img);
            const b64 = imgToB64(img);
            parent.postMessage({
              pluginMessage: {
                type: 'image',
                file: item.file,
                name: item.name,
                page: item.page,
                layout: item.layout,
                group: item.group,
                w: img.naturalWidth,
                h: img.naturalHeight,
                b64: b64,
              },
            }, '*');
            await ack();
          } catch (err) {
            parent.postMessage({ pluginMessage: { type: 'skip', file: item.file } }, '*');
            await ack();
          }
        }
        bar.value = SHOTS.length;
        parent.postMessage({ pluginMessage: { type: 'done' } }, '*');
      }
